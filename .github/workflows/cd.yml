name: CD - Backend (Build e Deploy)

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sgpj-backend
  INSTANCE_ID_A: i-0387954dbf0273b17
  INSTANCE_ID_B: i-060c220c35ae7d6a5

jobs:
  build-and-push:
    name: Build JAR + Imagem Docker + Push ECR
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-push.outputs.image }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Gerar JAR (sem testes, já validados no CI)
        run: mvn clean package -DskipTests --file pom.xml

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push da imagem para o ECR
        id: build-push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy nas EC2s via SSM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Atualizar container backend nas EC2s
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID_A }}" "${{ env.INSTANCE_ID_B }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/app-backend && docker compose pull backend && docker compose up -d backend"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Aguardando execução nas instâncias..."
          sleep 30

          # Verifica resultado em backend-a
          STATUS_A=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.INSTANCE_ID_A }}" \
            --query "Status" --output text)

          # Verifica resultado em backend-b
          STATUS_B=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.INSTANCE_ID_B }}" \
            --query "Status" --output text)

          echo "Status backend-a: $STATUS_A"
          echo "Status backend-b: $STATUS_B"

          if [ "$STATUS_A" != "Success" ] || [ "$STATUS_B" != "Success" ]; then
            echo "❌ Deploy falhou em uma ou mais instâncias!"
            exit 1
          fi

          echo "✅ Deploy realizado com sucesso nas duas instâncias!"
