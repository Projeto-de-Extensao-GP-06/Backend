name: CD - Backend (Build e Deploy)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sgpj-backend

jobs:
  build-and-push:
    name: Build JAR + Imagem Docker + Push ECR
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-push.outputs.image }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Gerar JAR (sem testes, ja validados no CI)
        run: mvn clean package -DskipTests --file pom.xml

      - name: Verificar credenciais AWS
        id: check-aws
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
            echo "Credenciais AWS encontradas no repositorio."
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "Aviso: Credenciais AWS ausentes nos secrets. As etapas de ECR e Deploy serao ignoradas (JAR compilado com sucesso)."
          fi

      - name: Configurar credenciais AWS
        if: steps.check-aws.outputs.has_credentials == 'true'
        id: aws-auth
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        if: steps.check-aws.outputs.has_credentials == 'true' && steps.aws-auth.outcome == 'success'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push da imagem para o ECR
        if: steps.check-aws.outputs.has_credentials == 'true' && steps.aws-auth.outcome == 'success'
        id: build-push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Aviso de credenciais expiradas ou ausentes
        if: steps.check-aws.outputs.has_credentials != 'true' || steps.aws-auth.outcome != 'success'
        run: |
          echo "::warning::Credenciais AWS invalidas ou expiradas (comum no AWS Academy). O JAR foi gerado com sucesso, mas o push para o ECR foi ignorado."

  deploy:
    name: Deploy nas EC2s via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.image != ''

    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descobrir instancias de Backend e atualizar containers via SSM
        run: |
          echo "Buscando instancias ativas de backend..."
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ec2-backend-a,ec2-backend-b" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "Nenhuma EC2 de backend ativa encontrada no momento (ambiente desligado/destroy)."
            echo "A nova imagem ja foi publicada no Amazon ECR com sucesso! Quando a infraestrutura for recriada, ela subira com essa versao."
            exit 0
          fi

          echo "Instancias encontradas: $INSTANCE_IDS"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/app-backend && if docker info | grep -q '\''Swarm: active'\''; then aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 487375662162.dkr.ecr.us-east-1.amazonaws.com && docker service update --with-registry-auth --image 487375662162.dkr.ecr.us-east-1.amazonaws.com/sgpj-backend:latest sgpj_backend_backend; else docker compose pull backend && docker compose up -d backend; fi"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Aguardando execucao nas instancias..."
          sleep 25

          FAILED=0
          for ID in $INSTANCE_IDS; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status $ID: $STATUS"
            if [ "$STATUS" != "Success" ]; then
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "Deploy falhou em uma ou mais instancias!"
            exit 1
          fi

          echo "Deploy realizado com sucesso em todas as instancias de Backend!"