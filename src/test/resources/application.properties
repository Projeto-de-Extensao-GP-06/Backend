spring.application.name=sgpj-test

# Desabilita execução do schema.sql (específico de MySQL) nos testes
spring.sql.init.mode=never

# DataSource H2 para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Validação de Segredos e JWT (Base64 com mais de 256 bits)
security.validate-secrets=false
jwt.validity=900
jwt.refresh.validity=86400
jwt.secret=dGVzdGUtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLXZhbGlkYXRpb24tc2dwai1hcHBsaWNhdGlvbi10ZXN0czEyMw==
cookie.secure=false

# Microsoft Azure Graph
microsoft.client-id=test-client-id
microsoft.client-secret=test-client-secret
microsoft.tenant-id=common
microsoft.redirect-uri=http://localhost:8080/login/oauth2/code/azure

# DataJud
datajud.api-key=test-datajud-api-key

# Mailpit
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username.from=nao-responda@sgpj.com.br

# Observabilidade OTLP
otel.traces.exporter=none
otel.metrics.exporter=none
otel.logs.exporter=none
